# The suite's tests on real Windows, macOS and Linux machines at every push (BUILD 27).
# The art worker's GPU side isn't tested here — GitHub's machines have no NVIDIA card; every test runs on the example game.
name: suite
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the suite needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-suite.txt
          python -m pip install playwright
      - name: The tests (the browser pass uses the machine's Chrome where it has one)
        run: python -m pytest -q -p no:cacheprovider
